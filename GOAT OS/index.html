<div id="login">

  <!-- WINDOWS -->

  <!-- NOTES -->
  <div class="window" id="notes">
    <div class="header">
      <div class="buttons">
        <span class="red" onclick="closeApp('notes')"></span>
        <span class="yellow"></span>
        <span class="green"></span>
      </div>
      <p>Notes</p>
    </div>
    <textarea></textarea>
  </div>

  <!-- GOOGLE -->
  <div class="window" id="browser">
    <div class="header">
      <div class="buttons">
        <span class="red" onclick="closeApp('browser')"></span>
        <span class="yellow"></span>
        <span class="green"></span>
      </div>
      <p>Google</p>
    </div>
    <div class="content">
      <input id="search">
      <button onclick="search()">Search</button>
    </div>
  </div>

  <!-- TERMINAL -->
  <div class="window terminal" id="terminal">
    <div class="header">
      <div class="buttons">
        <span class="red" onclick="closeApp('terminal')"></span>
        <span class="yellow"></span>
        <span class="green"></span>
      </div>
      <p>Terminal</p>
    </div>
    <div id="output"></div>
    <input id="cmd" onkeydown="terminalRun(event)">
  </div>

  <!-- CALCULATOR -->
  <div class="window" id="calc">
    <div class="header">
      <div class="buttons">
        <span class="red" onclick="closeApp('calc')"></span>
        <span class="yellow"></span>
        <span class="green"></span>
      </div>
      <p>Calculator</p>
    </div>
    <div class="content">
      <input id="calcInput">
      <button onclick="calculate()">=</button>
      <p id="calcResult"></p>
    </div>
  </div>

  <!-- FILES -->
  <div class="window" id="files">
    <div class="header">
      <div class="buttons">
        <span class="red" onclick="closeApp('files')"></span>
        <span class="yellow"></span>
        <span class="green"></span>
      </div>
      <p>Files</p>
    </div>
    <div class="content">
      <p><b>Images</b></p>

  <img src="https://picsum.photos/150" onclick="openPreview(this.src)">
  <img src="https://picsum.photos/151" onclick="openPreview(this.src)">

    </div>
  </div>

  <!-- MUSIC -->
  <div class="window" id="music">
    <div class="header">
      <div class="buttons">
        <span class="red" onclick="closeApp('music')"></span>
        <span class="yellow"></span>
        <span class="green"></span>
      </div>
      <p>Music</p>
    </div>
    <div class="content">
      <audio controls>
        <source src="file:///C:/Users/Hp/Downloads/assets_audio_HEAVENLY%20JUMPSTYLE.mp3">
      </audio>
    </div>
  </div>

  <!-- WEATHER -->
  <div class="window" id="weather">
    <div class="header">
      <div class="buttons">
        <span class="red" onclick="closeApp('weather')"></span>
        <span class="yellow"></span>
        <span class="green"></span>
      </div>
      <p>Weather</p>
    </div>
    <div class="content">
      <p>Kerala: 30°C Sunny</p>
    </div>
  </div>

  <!-- SETTINGS -->
  <div class="window" id="settings">
    <div class="header">
      <div class="buttons">
        <span class="red" onclick="closeApp('settings')"></span>
      </div>
      <p>Settings</p>
    </div>
<div class="content">
  <button onclick="setWallpaper(1)">Ocean</button>
  <button onclick="setWallpaper(2)">Mountain</button>
  <button onclick="setWallpaper(3)">Dark</button>

  <br><br>

  <button onclick="alert('GOAT OS v1.0')">About</button>
</div>

</div> 

<script src="script.js"></script>
</body>
</html>
