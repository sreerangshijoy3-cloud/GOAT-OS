<!DOCTYPE html>
<html>
<head>
  <title>GOAT OS</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- LOGIN SCREEN -->
<div id="login">
  <div class="loginBox">
    <h1>GOAT OS</h1>
    <input id="username" placeholder="Enter username">
    <button onclick="login()">Enter System</button>
  </div>
</div>

<!-- OS -->
<div id="os">

  <!-- TOP BAR -->
  <div id="topbar">
    <span>GOAT OS</span>
    <span id="time"></span>
  </div>

  <!-- DOCK -->
  <div id="dock">
    <img src="https://cdn-icons-png.flaticon.com/512/1828/1828919.png" onclick="openApp('notes')">
    <img src="https://cdn-icons-png.flaticon.com/512/281/281764.png" onclick="openApp('browser')">
    <img src="https://cdn-icons-png.flaticon.com/512/906/906324.png" onclick="openApp('terminal')">
    <img src="https://cdn-icons-png.flaticon.com/512/992/992700.png" onclick="openApp('calc')">
    <img src="https://cdn-icons-png.flaticon.com/512/716/716784.png" onclick="openApp('files')">
    <img src="https://cdn-icons-png.flaticon.com/512/727/727245.png" onclick="openApp('music')">
    <img src="https://cdn-icons-png.flaticon.com/512/869/869869.png" onclick="openApp('weather')">
    <img src="https://cdn-icons-png.flaticon.com/512/2099/2099058.png" onclick="openApp('settings')">
    <img src="https://cdn-icons-png.flaticon.com/512/992/992700.png" onclick="openApp('clockApp')">
  </div>

  <!-- WINDOWS -->

  <!-- NOTES -->
  <div class="window" id="notes">
    <div class="header">
      <div class="buttons">
        <span class="red" onclick="closeApp('notes')"></span>
        <span class="yellow"></span>
        <span class="green"></span>
      </div>
      <p>Notes</p>
    </div>
    <textarea></textarea>
  </div>

  <!-- GOOGLE -->
  <div class="window" id="browser">
    <div class="header">
      <div class="buttons">
        <span class="red" onclick="closeApp('browser')"></span>
        <span class="yellow"></span>
        <span class="green"></span>
      </div>
      <p>Google</p>
    </div>
    <div class="content">
      <input id="search">
      <button onclick="search()">Search</button>
    </div>
  </div>

  <!-- TERMINAL -->
  <div class="window terminal" id="terminal">
    <div class="header">
      <div class="buttons">
        <span class="red" onclick="closeApp('terminal')"></span>
        <span class="yellow"></span>
        <span class="green"></span>
      </div>
      <p>Terminal</p>
    </div>
    <div id="output"></div>
    <input id="cmd" onkeydown="terminalRun(event)">
  </div>

  <!-- CALCULATOR -->
  <div class="window" id="calc">
    <div class="header">
      <div class="buttons">
        <span class="red" onclick="closeApp('calc')"></span>
        <span class="yellow"></span>
        <span class="green"></span>
      </div>
      <p>Calculator</p>
    </div>
    <div class="content">
      <input id="calcInput">
      <button onclick="calculate()">=</button>
      <p id="calcResult"></p>
    </div>
  </div>

  <!-- FILES -->
  <div class="window" id="files">
    <div class="header">
      <div class="buttons">
        <span class="red" onclick="closeApp('files')"></span>
        <span class="yellow"></span>
        <span class="green"></span>
      </div>
      <p>Files</p>
    </div>
    <div class="content">
      <p>empty</p>
    </div>
  </div>

  <!-- MUSIC -->
  <div class="window" id="music">
    <div class="header">
      <div class="buttons">
        <span class="red" onclick="closeApp('music')"></span>
        <span class="yellow"></span>
        <span class="green"></span>
      </div>
      <p>Music</p>
    </div>
    <div class="content">
      <audio controls>
        <source src="">
      </audio>
    </div>
  </div>

  <!-- WEATHER -->
  <div class="window" id="weather">
    <div class="header">
      <div class="buttons">
        <span class="red" onclick="closeApp('weather')"></span>
        <span class="yellow"></span>
        <span class="green"></span>
      </div>
      <p>Weather</p>
    </div>
    <div class="content">
      <p>Kerala: 30°C Sunny</p>
    </div>
  </div>

  <!-- SETTINGS -->
  <div class="window" id="settings">
    <div class="header">
      <div class="buttons">
        <span class="red" onclick="closeApp('settings')"></span>
      </div>
      <p>Settings</p>
    </div>
    <div class="content">
      <button onclick="setWallpaper(1)">Ocean</button>
      <button onclick="setWallpaper(2)">Mountain</button>
      <button onclick="setWallpaper(3)">Dark</button>
    </div>
  </div>

  <!-- CLOCK -->
  <div class="window" id="clockApp">
    <div class="header">
      <div class="buttons">
        <span class="red" onclick="closeApp('clockApp')"></span>
      </div>
      <p>Clock</p>
    </div>
    <h1 id="bigClock"></h1>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
